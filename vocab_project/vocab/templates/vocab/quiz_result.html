{% extends 'vocab/base.html' %}

{% block content %}
<div class="quiz-container">
    <h2>Результат проверки</h2>
    <div class="progress">Прогресс: {{ progress }}</div>
    
    <div class="card result-card {% if is_correct %}correct{% else %}incorrect{% endif %}">
        {% if is_correct %}
            <div class="result-message correct-message">
                ✔ Правильно!
            </div>
        {% else %}
            <div class="result-message incorrect-message">
                ✖ Неправильно. Правильный ответ: 
                <span class="correct-answer">{{ correct_answer }}</span>
            </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="next-button">
                Продолжить тренировку →
            </button>
        </form>
    </div>
</div>
{% endblock %}
