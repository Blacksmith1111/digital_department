{% extends 'vocab/base.html' %}

{% block content %}
    <h1>Редактировать карточку</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn">Сохранить изменения</button>
            <a href="{% url 'study_set' card.set.id %}" class="btn cancel">Отмена</a>
        </div>
    </form>
{% endblock %}
